add_newline = false
# A minimal left prompt. $kubernetes leads (kube-ps1 position) — it only renders
# inside a kubie shell (detect_env_vars=KUBE_PS1_ENABLED), so it's invisible otherwise.
format = """$kubernetes$directory$character"""
palette = "catppuccin_mocha"
# move the rest of the prompt to the right. $all covers every module NOT named
# explicitly, so naming cmd_duration/time after it pins the timing pair to the
# far right: "<modules> took <duration> at <clock>".
right_format = """$all$cmd_duration$time"""
command_timeout = 1000

[character]
vicmd_symbol = '[\[N\] >>>](bold yellow)'
success_symbol = '[➜](bold green)'

[directory.substitutions]
'~/tests/starship-custom' = 'work-project'

[git_branch]
format =  '[$symbol$branch(:$remote_branch)]($style)'

[aws]
format = '[$symbol(profile: "$profile" )(\(region: $region\) )]($style)'
disabled = true
style = 'bold blue'
symbol = " "

[golang]
format = '[ ](bold cyan)'

[kubernetes]
symbol = "\U000F10FE "   # nf-md-kubernetes (Nerd Font Kubernetes logo)
disabled = false
# Only render inside a kubie shell — kubie's start_ctx hook exports
# KUBE_PS1_ENABLED, so the module appears only when that var is set.
detect_env_vars = ['KUBE_PS1_ENABLED']
format = '[$symbol$context( \($namespace\))]($style) '
style = 'bold blue'

# Strip the common "t.stellarcyber.cloud-" prefix so the prompt shows a short name.
[[kubernetes.contexts]]
context_pattern = "t\\.stellarcyber\\.cloud-(?P<name>.*)"
context_alias = "$name"

[docker_context]
disabled = true

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"

[gcloud]
disabled = true

# Every command reports its wall-clock cost, not just the slow ones: starship
# defaults to min_time=2000 (only >2s commands print "took"), so a 40ms kubectl
# call showed nothing. min_time=0 + milliseconds = an exact duration each time.
# Dial back with min_time = 500 if per-prompt timings get noisy; drop
# show_milliseconds to lose the "0ms" tail on long durations ("1m5s0ms").
[cmd_duration]
min_time = 0
show_milliseconds = true
format = 'took [$duration]($style) '
style = 'bold peach'

# Clock stamped when the prompt is drawn — i.e. the moment the command FINISHED
# (start time = this minus $cmd_duration). Dim so the duration stays the
# foreground of the pair. Persistent per-command timestamps live in the zsh
# history file (EXTENDED_HISTORY, see zshrc) and in atuin's DB.
[time]
disabled = false
time_format = '%H:%M:%S'
format = 'at [$time]($style)'
style = 'subtext0'
